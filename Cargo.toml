[package]
name = "shoin"
version = "0.1.1"
edition = "2021"
# 1.88 because `ratatui` 0.30 requires it. This was 1.82 — a number from before
# the dependency bumped — and nothing checked it; the CI `msrv` job reads this
# field now, so the claim and the build cannot drift apart again.
rust-version = "1.88"
description = "A no-clutter terminal Markdown editor with modal editing"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/nol00p/Shoin"
homepage = "https://github.com/nol00p/Shoin"
keywords = ["markdown", "editor", "tui", "vim", "notes"]
categories = ["text-editors", "command-line-utilities"]

[[bin]]
name = "shoin"
path = "src/main.rs"

[dependencies]
# TUI. crossterm is used via `ratatui::crossterm` re-export, never as a
# separate dependency — two crossterm versions would fight over the terminal.
ratatui = "0.30"

# Rope text buffer
ropey = "1.6"

# Config
toml = "1.1"
serde = { version = "1.0", features = ["derive"] }
notify = "8.2"

# Text handling
unicode-width = "0.2"

# CLI + errors
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"

# TestBackend, which the frame tests render into, ships with ratatui's default
# features — so there are no dev-dependencies at all.

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
