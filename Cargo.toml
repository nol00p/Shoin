[package]
name = "shoin"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "A no-clutter terminal Markdown editor with modal editing"
license = "Apache-2.0"
readme = "README.md"
# Add `repository`, `homepage` and `keywords` before publishing to crates.io.

[[bin]]
name = "shoin"
path = "src/main.rs"

[dependencies]
# TUI. crossterm is used via `ratatui::crossterm` re-export, never as a
# separate dependency — two crossterm versions would fight over the terminal.
ratatui = "0.30"

# Rope text buffer
ropey = "1.6"

# Config
toml = "1.1"
serde = { version = "1.0", features = ["derive"] }
notify = "8.2"

# Text handling
unicode-width = "0.2"

# CLI + errors
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"

# TestBackend, which the frame tests render into, ships with ratatui's default
# features — so there are no dev-dependencies at all.

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
