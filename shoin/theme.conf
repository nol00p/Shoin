# theme.conf — colors and text attributes (default: Tokyo Night, dark)
#
# Colors: "#rrggbb", "#rgb", a 0-255 index, or a name ("red", "bright_black").
# A NAME or an index means "whatever the terminal has in that slot"; a hex value
# is exact. Truecolor is used when available and downgraded automatically
# otherwise. Set `name` to load ~/.config/shoin/themes/<name>.toml instead.
#
# This file is the built-in default written out, and a test asserts the two stay
# identical — so editing a color here without editing `Theme::default()` in
# `src/render/theme.rs` (or the other way round) fails the build.
#
# THE TOKYO NIGHT PALETTE — the authority for anything that should read as a
# terminal color:
#
#    0 black          #15161e   near-black navy
#    1 red            #f7768e   coral / salmon pink
#    2 green          #9ece6a   apple green
#    3 yellow         #e0af68   sand / amber
#    4 blue           #7aa2f7   cornflower blue
#    5 magenta        #bb9af7   lavender
#    6 cyan           #7dcfff   sky blue
#    7 white          #a9b1d6   pale periwinkle grey
#    8 bright black   #414868   slate blue-grey
#    9-15             repeat 1-7 — Tokyo Night does not brighten them
#
# The colors below that are NOT in that table are Tokyo Night's UI colors, which
# have no slot and should not be forced into one: background #1a1b26,
# text #c0caf5, comment #565f89, selection #283457, orange #ff9e64,
# bg_highlight #24283b, blue0 #3d59a1, fg_dark #9aa5ce.

[theme]
# name = "gruvbox"

background   = "#1a1b26"
text         = "#c0caf5"
text_dim     = "#565f89"     # markers, and non-focused text in focus mode
cursor       = "#c0caf5"
cursor_line  = "none"        # "none" for no current-line highlight
selection    = "#283457"
search_match = "#e0af68"

# The six terminal hues in order, so a heading's LEVEL reads as which color it
# is rather than as a shade of one.
heading_1 = "#f7768e"        # red      — coral / salmon pink
heading_2 = "#9ece6a"        # green    — apple green
heading_3 = "#e0af68"        # yellow   — sand / amber
heading_4 = "#7aa2f7"        # blue     — cornflower blue
heading_5 = "#bb9af7"        # magenta  — lavender
heading_6 = "#7dcfff"        # cyan     — sky blue

bold          = "#ff9e64"
italic        = "#c0caf5"
strikethrough = "#565f89"
highlight_bg  = "#3d59a1"

code       = "#9ece6a"
code_bg    = "#24283b"
fence_bar  = "#414868"       # gutter bar beside fenced code blocks

# Syntax highlighting inside a fenced block, when the fence names a language
# shoin knows (`[markdown] code_syntax`). Code the lexer does not classify keeps
# the ordinary `text` color — the slab is what says "this is code", so painting
# every identifier green would leave nothing for the strings.
syntax_keyword  = "#bb9af7"
syntax_type     = "#7dcfff"
syntax_string   = "#9ece6a"
syntax_literal  = "#ff9e64"  # numbers, and `true` / `nil` / `None`
syntax_comment  = "#565f89"
syntax_function = "#7aa2f7"
syntax_punct    = "#9aa5ce"  # operators and delimiters, deliberately quiet

# The conflict diff view (:diff). Whole-line foregrounds, as git colours them.
diff_add        = "#9ece6a"  # only on the disk side
diff_remove     = "#f7768e"  # only in your buffer
diff_change     = "#e0af68"  # both sides differ

link       = "#7aa2f7"
wiki_link  = "#bb9af7"
tag        = "#7dcfff"
tag_bg     = "#283457"

quote        = "#9aa5ce"
quote_bar    = "#414868"
list_bullet  = "#7aa2f7"
task_done    = "#565f89"
rule         = "#414868"
table_border = "#414868"

indent_colors = ["#414868", "#565f89", "#7aa2f7", "#bb9af7"]

status_fg = "#565f89"
status_bg = "none"
error     = "#f7768e"

[theme.styles]
heading_bold   = true
heading_italic = false
bold_attr      = true        # render bold weight, not just color
italic_attr    = true
link_underline = true
dim_markers    = true        # ** _ ` # > markers drawn in text_dim
