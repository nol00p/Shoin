# tree.conf — the file-tree pane (<leader>fe in this file's folder, or where
# Shoin was launched with root = "cwd"; <leader>fE over $HOME).
#
# Inside the tree: j/k move, l/Enter opens, h collapses, - and = move the
# ROOT itself, a/r/m/d create, rename, move and delete, q closes.

[tree]
# List dotfiles from the start. `H` toggles it live either way — this is only
# the state the tree opens with, and a hot reload puts it back.
show_hidden = false
# Close the tree once it opens a file. Off, it stays beside the editor and
# hands focus back, so the next file is one Ctrl-w h away.
close_on_open = false
# Where <leader>fe and <leader>ff open: "file", the edited file's folder, or
# "cwd", the folder Shoin was launched from — the whole vault when your notes
# sit in subfolders. `file_tree_cwd` / `find_file_cwd` go there regardless.
root = "file"
