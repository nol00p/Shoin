# keys.conf — keybindings
#
# Format:  "<key sequence>" = "<action>"
# Modifiers: <C-x> ctrl, <M-x> alt, <S-x> shift. Named: <Esc> <CR> <Tab>
#   <Space> <BS> <Up> <Down> <Left> <Right> <Home> <End> <PageUp> <PageDown>
# <leader> expands to [input].leader (a space by default).
#
# Only overrides go here — every built-in binding stays active unless you
# rebind it. A binding whose action is unknown is skipped (with a warning),
# never fatal. A binding may name a VERB, not just a discrete action, so the
# grammar itself moves: "s" = "operator_delete" keeps counts, objects and the
# doubled form (ss).
#
# An exact match fires as soon as it is complete, so a binding that is also the
# START of a longer one shadows it — that is warned about at load time.
# `g`, `z` and `<C-w>` are built-in prefixes; you can bind under them freely.
# [keys.insert] takes SINGLE keys only (see SPEC §7.2).

[keys.normal]
"<leader>w"  = "save"
"<leader>q"  = "quit"
"<leader>F"  = "cycle_focus"     # focus mode (f is the file/find prefix)
"<leader>t"  = "toggle_typewriter"
"<leader>z"  = "toggle_zen"
"<leader>c"  = "toggle_conceal"
# Inside the tree, `-` re-roots one level up and `+` into the selected dir.
"<leader>fe" = "file_tree"       # file tree in the edited file's folder
"<leader>fE" = "file_tree_home"  # file tree over $HOME
"<leader>ff" = "find_file"       # fuzzy finder in the edited file's directory
"<leader>fF" = "find_file_home"  # fuzzy finder over $HOME
"<leader>fb" = "find_buffer"     # switch between open buffers
"<leader>sv" = "split_vertical"  # split beside / close the split again
"<leader>ss" = "split_horizontal"
"<leader>so" = "only_pane"       # keep only the focused pane
"<C-s>"      = "save"

[keys.insert]
"<C-s>" = "save_stay_insert"

[keys.visual]
"<leader>b" = "toggle_bold"
"<leader>i" = "toggle_italic"
