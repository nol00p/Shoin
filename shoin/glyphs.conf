# glyphs.conf — decorative glyphs (some need a Nerd Font)
#
# `nerd_fonts = false` swaps every glyph you have NOT set here for an ASCII
# fallback. Keep every glyph ONE CELL wide: a concealed marker is replaced one
# char for one char, so a wider glyph would shift the line's text.
#
# The Nerd Font icons are written as \u escapes — those codepoints live in the
# Private Use Area, where the literal character is invisible in most editors.

[glyphs]
nerd_fonts     = true        # false = ASCII fallbacks everywhere
bullet         = "•"         # concealed `- x` marker
bullet_alt     = "◦"         # …and the one a sublist alternates to
task_todo      = "☐"         # concealed `- [ ] x` box
task_done      = "☑"         # concealed `- [x] x` tick
quote_bar      = "▎"
indent_guide   = "│"
fence_bar      = "▊"         # gutter bar beside a fenced code block
folder         = ""    # file tree: a collapsed directory
folder_open    = ""    # file tree: an expanded directory
modified       = "●"
conflict       = "⚠"         # the file changed on disk under unsaved changes
scroll_hint    = "▐"         # position indicator, only while the text overflows
rule           = "─"
