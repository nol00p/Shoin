# editor.conf — editing behavior and the cursor

[editor]
tab_width         = 4
expand_tab        = true       # insert spaces on Tab
auto_indent       = true       # Enter carries the line's indent, and continues
                               # a list marker or quote prefix. Enter on an
                               # EMPTY item ends the list instead.
auto_pair         = false      # close ( [ { " ' ` as you type them. Off by
                               # default: prose is full of unmatched quotes, so
                               # a quote never pairs against a word character
                               # (don't stays don't) even when it is on.
trim_on_save      = false      # strip trailing whitespace when saving
final_newline     = "preserve" # preserve | always | never
undo_coalesce_ms  = 400
scroll_off        = 3          # keep N lines visible above/below the cursor

[cursor]
normal = "block"               # block | bar | underline
insert = "bar"
visual = "block"
blink  = false
