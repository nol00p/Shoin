# input.conf — input, Markdown ruleset, and (v2) transclusion

[input]
sequence_timeout_ms = 500    # max gap BETWEEN the characters of escape_alias.
                             # Key SEQUENCES need no timeout: an exact match
                             # fires as soon as it is complete.
leader              = " "    # <leader> in binding strings
escape_alias        = "jk"   # type this in Insert mode to leave it; "" disables.
                             # The first character appears immediately and is
                             # taken back when the alias completes.
mouse               = true   # click-to-position + wheel scroll. false = leave the
                             # terminal's native text selection/copy alone

[markdown]
tags       = true            # style #tags
wiki_links = true            # style [[wiki links]]
highlight  = true            # style ==highlight==
tables     = true
# Syntax-highlight a fenced block whose info string names a language shoin
# knows (rust, python, js, ts, go, c, c++, java, ruby, lua, sh, sql, json,
# yaml, toml, html, css and their usual aliases). An unknown language renders
# as it always did: a flat slab. `:set code_syntax` toggles it live.
code_syntax = true
plain_text_extensions = [".txt"]   # .txt uses a reduced ruleset regardless

# Transclusion — `![[note]]` embeds another file's contents. `:embed [mode]`
# expands them in place; `:export [md|txt|html|pdf]` writes the finished
# document out. HTML is one self-contained page in your theme's colors. Only
# PDF needs anything installed (pandoc and a layout engine on PATH).
[transclude]
embed             = "none"   # how much of an ![[...]] to expand in place:
                             #   none   leave the link as written
                             #   short  the target's own text, in a box
                             #   rec    …and whatever IT embeds, recursively
                             #   full   rec with no box — reads as one document
                             # `:embed [mode]` changes it for the session, and
                             # a bare `:embed` toggles off and back.
root              = "."      # search root for bare-name resolution
max_depth         = 8        # recursion cap for :export; a cycle is a hard
                             # error naming the loop, never a truncation
heading_offset    = 1        # demote embedded headings by nesting depth
strip_frontmatter = true
border            = true     # labelled box around embedded regions
