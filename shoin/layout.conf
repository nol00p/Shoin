# layout.conf — the IA Writer surface
#
# Part of a conf.d-style config: every *.conf file in this directory is merged.
# Every key is optional; delete anything to fall back to its built-in default.
# Saving reloads live; a parse error keeps the running config and flashes.

[layout]
measure           = 72       # the text width in columns; shrinks if the terminal
                             # is narrower. `:set measure=N` changes it live.
align             = "center" # center | left
padding_top       = 2        # blank rows above the first line
padding_bottom    = 2
hanging_indent    = true     # wrapped list lines align under the item's content
line_spacing      = 0        # blank rows after each line — line height, on a grid
                             # that has none. 0-4. Blank lines, fenced code and
                             # table interiors are left alone, so a paragraph
                             # break stays one gap wider than the lines inside it.
scroll_hint       = true     # 1-column position indicator at the right edge,
                             # shown only while the document overflows the screen
typewriter        = false    # pin the cursor line at a fixed height
typewriter_anchor = 0.5      # 0.0 = top, 0.5 = center, 1.0 = bottom
focus             = "off"    # off | paragraph | sentence

# Live preview: the line you're on shows raw Markdown, every other line shows it
# formatted with markers hidden. Set false to render every line raw and dimmed.
conceal           = true
# Reserve reveal width for the active line so text doesn't shift sideways when
# markers reappear. Costs a little horizontal slack, buys zero jitter.
stable_gutter     = true

[status]
enabled   = true             # false = never show the status line at all
flash_ms  = 1500             # how long it stays up after save/mode change/error
show      = ["file", "modified", "position", "words"]

# The start screen — what `shoin` with no file argument draws above the hints.
[splash]
art = ""                     # "" = the built-in bonsai
                             # "none" = no drawing, just the hints
                             # a path = your own text file, drawn instead.
                             #   Relative paths resolve against THIS directory,
                             #   so `art = "art.txt"` beside your .conf files
                             #   works; `~` is expanded. A file that cannot be
                             #   read falls back to the bonsai and says so.
